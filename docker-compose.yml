services:
  db:
    image: postgres:15
    container_name: tutasnack-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: tutasnack
      POSTGRES_PASSWORD: tutasnack
      POSTGRES_DB: tutasnack
    ports:
      - "5439:5432"
    volumes:
      - tutasnackdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tutasnack -d tutasnack"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  tutasnackdata:
