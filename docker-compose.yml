services:
  db:
    image: postgres:16-alpine
    container_name: tutasnack-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: tutasnack
      POSTGRES_PASSWORD: tutasnack
      POSTGRES_DB: tutasnack
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tutasnack -d tutasnack"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
