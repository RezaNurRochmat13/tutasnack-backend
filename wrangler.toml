name = "tutasnack-backend"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[placement]
mode = "smart"

[vars]
DATABASE_URL = "postgresql://tutasnack:tutasnack@localhost:5439/tutasnack"
DIRECT_URL = "postgresql://tutasnack:tutasnack@localhost:5439/tutasnack"
JWT_SECRET = "tutasnack-dev-secret-change-in-production"
USE_NEON_ADAPTER = "true"
NODE_ENV = "development"

[env.production]
vars = { NODE_ENV = "production" }
